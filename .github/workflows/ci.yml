name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m compileall -q sigma tests
      - run: python -m pytest -q

  quality-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,quality,kdf]"
      - run: ruff check sigma scripts experiments tests
      - run: ruff format --check sigma scripts experiments tests
      - run: mypy sigma scripts experiments tests
      - run: python -m pytest -q tests/unit/test_kdf_argon2id.py
      - run: python -m scripts.generate_v3_r12_corpus --check
      - run: python -m scripts.generate_v3_r125_corpus --check
      - run: python -m scripts.check_r13_design
      - run: python -m scripts.prepare_v3_confirmatory --check
      - run: python -m scripts.create_r14_protocol_freeze --check
      - run: python -m scripts.check_r14_freeze
      - run: python -m scripts.check_r15_plan
      - run: python -m scripts.check_r15_execution_closure
      - run: python -m scripts.check_r15_data_closure
      - run: python -m scripts.check_r141_protocol
      - run: python -m scripts.check_r141_freeze
      - run: python -m scripts.r15_preflight --static
      - run: python -m scripts.check_r15_harness
      - run: python -m scripts.check_r15_structural_shadow
      - run: python -m scripts.check_r15_reduced_shadow
      - run: python -m scripts.check_r15_application_shadow
      - run: python -m build
      - run: python scripts/release_artifacts.py dist
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python -c "from sigma.presets import lightweight_v2_2; from sigma.v2 import hash_bytes; assert hash_bytes(b'wheel-smoke', lightweight_v2_2()).states"
      - run: python -c "from sigma.sources import BytesSource; from sigma.spec.context_v3 import SigmaContextV3; from sigma.spec.ids_v3 import SuiteIdV3; from sigma.v3 import evaluate_v3; c=SigmaContextV3.for_suite(SuiteIdV3.REFERENCE_IAP_HISTORY_V3,salt=b'ci',challenge=b'ci',application_context=b'ci'); e=evaluate_v3(c,BytesSource(b'ci-history')); assert len(e.histories)==len(e.states)"


  authoritative-gate:
    name: authoritative R14.1 gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install
          pytest hypothesis "coverage[toml]" argon2-cffi cryptography
          mypy ruff build
      - run: python -m scripts.validate_project --fuzz-iterations 200 --report /tmp/sigma-r14-gate.json
      - uses: actions/upload-artifact@v4
        with:
          name: r141-authoritative-gate
          path: /tmp/sigma-r14-gate.json
          if-no-files-found: error
          retention-days: 30


  r14-freeze-bundle:
    name: build R14 freeze bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install
          -c constraints/r14-v3-py313.txt
          ".[test,quality,analysis,kdf,signatures]"
      - run: python -m scripts.check_r14_freeze --report /tmp/r14-freeze-gate.json
      - run: python -m build --outdir /tmp/r14-dist
      - run: python scripts/release_artifacts.py /tmp/r14-dist
      - run: >-
          python -m scripts.build_r14_runtime_manifest
          --distribution /tmp/r14-dist
          --protocol-freeze experiments/configs/v3-confirmatory-frozen/protocol-freeze.json
          --output /tmp/r14-runtime-manifest.json
          --source-commit "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: r14-freeze-bundle
          path: |
            /tmp/r14-freeze-gate.json
            /tmp/r14-runtime-manifest.json
            /tmp/r14-dist/*
            experiments/preregistration-v3.md
            experiments/configs/v3-confirmatory-frozen/
            constraints/r14-v3-py313.txt
          if-no-files-found: error
          retention-days: 30


  r141-freeze-bundle:
    name: build R14.1 publication freeze bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: echo "SOURCE_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_ENV"
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install
          -c constraints/r14-v3-py313.txt
          ".[test,quality,analysis,kdf,signatures]"
      - run: >-
          python -m scripts.check_r141_freeze
          --source-commit "$SOURCE_COMMIT"
          --report /tmp/r141-freeze-gate.json
      - run: python -m scripts.prepare_r141_confirmatory --output /tmp/r141-configs
      - run: >-
          python -m scripts.create_r141_source_freeze
          --source-commit "$SOURCE_COMMIT"
          --output /tmp/r141-source-freeze.json
      - run: python -m build --outdir /tmp/r141-dist
      - run: python scripts/release_artifacts.py /tmp/r141-dist
      - run: >-
          python -m scripts.build_r141_runtime_manifest
          --distribution /tmp/r141-dist
          --source-freeze /tmp/r141-source-freeze.json
          --configs /tmp/r141-configs
          --preregistration experiments/preregistration-v3-r141.md
          --dependency-lock constraints/r14-v3-py313.txt
          --source-commit "$SOURCE_COMMIT"
          --output /tmp/r141-runtime-manifest.json
      - run: python -m scripts.r15_preflight --static
      - uses: actions/upload-artifact@v4
        with:
          name: r141-freeze-bundle
          path: |
            /tmp/r141-freeze-gate.json
            /tmp/r141-source-freeze.json
            /tmp/r141-runtime-manifest.json
            /tmp/r141-configs/
            /tmp/r141-dist/*
            experiments/preregistration-v3-r141.md
            experiments/r15-publication-scale-plan.json
            experiments/r15-data-policy.json
            constraints/r14-v3-py313.txt
          if-no-files-found: error
          retention-days: 30


  r15-structural-shadow-battery:
    name: R15-C structural shadow battery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q tests/unit/test_r15_structural_shadow.py
      - run: python -m scripts.check_r15_structural_shadow --report /tmp/r15-c-shadow.json
      - uses: actions/upload-artifact@v4
        with:
          name: r15-c-structural-shadow
          path: /tmp/r15-c-shadow.json
          if-no-files-found: error
          retention-days: 30

  r15-reduced-shadow-battery:
    name: R15-D reduced cryptanalysis shadow battery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q tests/unit/test_r15_reduced_shadow.py
      - run: python -m scripts.check_r15_reduced_shadow --report /tmp/r15-d-shadow.json
      - uses: actions/upload-artifact@v4
        with:
          name: r15-d-reduced-shadow
          path: /tmp/r15-d-shadow.json
          if-no-files-found: error
          retention-days: 30

  r15-application-shadow-battery:
    name: R15-E application shadow battery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,kdf]"
      - run: python -m pytest -q tests/unit/test_r15_application_shadow.py
      - run: python -m scripts.check_r15_application_shadow --report /tmp/r15-e-shadow.json
      - uses: actions/upload-artifact@v4
        with:
          name: r15-e-application-shadow
          path: /tmp/r15-e-shadow.json
          if-no-files-found: error
          retention-days: 30

  r15-harness-battery:
    name: R15-B synthetic harness battery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q tests/unit/test_r15_harness.py
      - run: python -m scripts.check_r15_harness --report /tmp/r15-b-harness.json
      - uses: actions/upload-artifact@v4
        with:
          name: r15-b-harness-battery
          path: /tmp/r15-b-harness.json
          if-no-files-found: error
          retention-days: 30


  r125-corpus-artifact:
    name: regenerate R12.5 corpus artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m scripts.generate_v3_r125_corpus --check
      - run: python -m scripts.generate_v3_r125_corpus --output /tmp/conformance-v3-r12-5.json.gz.b64
      - uses: actions/upload-artifact@v4
        with:
          name: r125-frozen-corpus
          path: /tmp/conformance-v3-r12-5.json.gz.b64
          if-no-files-found: error
          retention-days: 7
