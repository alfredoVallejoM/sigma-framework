name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m compileall -q sigma tests
      - run: python -m pytest -q

  quality-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,quality,kdf]"
      - run: ruff check sigma scripts experiments tests
      - run: ruff format --check sigma scripts experiments tests
      - run: mypy sigma scripts experiments tests
      - run: python -m pytest -q tests/unit/test_kdf_argon2id.py
      - run: python -m build
      - run: python scripts/release_artifacts.py dist
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python -c "from sigma.presets import lightweight_v2; from sigma.v2 import hash_bytes; assert hash_bytes(b'wheel-smoke', lightweight_v2()).states"
