name: R15 Final Closure Autopilot

on:
  workflow_run:
    workflows:
      - R15 Internal Wave 2
      - R15 Internal Wave 3A
      - R15 Internal Completion Amendment
      - R15 STAT Confirmatory
      - R15 Exploratory Engineering Applications
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: r15-final-closure-autopilot
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve mandatory R15 acquisition runs
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.resolve.outputs.ready }}
      w1: ${{ steps.resolve.outputs.w1 }}
      w2: ${{ steps.resolve.outputs.w2 }}
      w2_sha: ${{ steps.resolve.outputs.w2_sha }}
      w3a: ${{ steps.resolve.outputs.w3a }}
      w3a_sha: ${{ steps.resolve.outputs.w3a_sha }}
      amendment: ${{ steps.resolve.outputs.amendment }}
      stat: ${{ steps.resolve.outputs.stat }}
      engineering: ${{ steps.resolve.outputs.engineering }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail

          latest_run() {
            local branch="$1"
            local workflow="$2"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${branch}&event=push&per_page=50"               --jq ".workflow_runs[] | select(.name == \"${workflow}\") | [.id,.status,.head_sha] | @tsv"               | head -n 1
          }

          latest_success() {
            local branch="$1"
            local workflow="$2"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${branch}&event=push&status=success&per_page=50"               --jq ".workflow_runs[] | select(.name == \"${workflow}\") | [.id,.status,.head_sha] | @tsv"               | head -n 1
          }

          W1="$(latest_success r15-wave1-audit-recovery 'R15 Wave 1 Audit Recovery' || true)"
          W2="$(latest_run r15-acquisition-wave2 'R15 Internal Wave 2' || true)"
          W3A="$(latest_run r15-acquisition-wave3a 'R15 Internal Wave 3A' || true)"
          AMEND="$(latest_run r15-internal-amendment-v1 'R15 Internal Completion Amendment' || true)"
          STAT="$(latest_run r15-stat-tooling-v1 'R15 STAT Confirmatory' || true)"
          ENG="$(latest_success r15-exploratory-engineering-apps 'R15 Exploratory Engineering Applications' || true)"

          printf 'W1=%s\nW2=%s\nW3A=%s\nAMEND=%s\nSTAT=%s\nENG=%s\n'             "$W1" "$W2" "$W3A" "$AMEND" "$STAT" "$ENG"

          w1_id="$(cut -f1 <<<"$W1")"
          w2_id="$(cut -f1 <<<"$W2")"
          w2_status="$(cut -f2 <<<"$W2")"
          w2_sha="$(cut -f3 <<<"$W2")"
          w3a_id="$(cut -f1 <<<"$W3A")"
          w3a_status="$(cut -f2 <<<"$W3A")"
          w3a_sha="$(cut -f3 <<<"$W3A")"
          amend_id="$(cut -f1 <<<"$AMEND")"
          amend_status="$(cut -f2 <<<"$AMEND")"
          stat_id="$(cut -f1 <<<"$STAT")"
          stat_status="$(cut -f2 <<<"$STAT")"
          eng_id="$(cut -f1 <<<"$ENG")"

          ready=false
          if [[ -n "$w1_id" && -n "$w2_id" && "$w2_status" == completed              && -n "$w3a_id" && "$w3a_status" == completed              && -n "$amend_id" && "$amend_status" == completed              && -n "$stat_id" && "$stat_status" == completed ]]; then
            ready=true
          fi

          {
            echo "ready=$ready"
            echo "w1=$w1_id"
            echo "w2=$w2_id"
            echo "w2_sha=$w2_sha"
            echo "w3a=$w3a_id"
            echo "w3a_sha=$w3a_sha"
            echo "amendment=$amend_id"
            echo "stat=$stat_id"
            echo "engineering=$eng_id"
          } >> "${GITHUB_OUTPUT}"

  close:
    name: Recover, merge, analyze and audit mandatory R15
    needs: resolve
    if: needs.resolve.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      W1_RUN: ${{ needs.resolve.outputs.w1 }}
      W2_RUN: ${{ needs.resolve.outputs.w2 }}
      W2_SHA: ${{ needs.resolve.outputs.w2_sha }}
      W3A_RUN: ${{ needs.resolve.outputs.w3a }}
      W3A_SHA: ${{ needs.resolve.outputs.w3a_sha }}
      AMEND_RUN: ${{ needs.resolve.outputs.amendment }}
      STAT_RUN: ${{ needs.resolve.outputs.stat }}
      ENG_RUN: ${{ needs.resolve.outputs.engineering }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: sigma-v3-iap
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[analysis]"
      - run: python -m pytest -q tests/unit/test_r15_final_closure.py

      - name: Download closed Wave 1 dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/w1
          gh run download "$W1_RUN"             -n r15-wave1-confirmatory-dataset-recovered             -D /tmp/w1

      - name: Recover Wave 2 from scientific shards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/w2-unlock /tmp/w2-shards/history /tmp/w2-shards/layout /tmp/w2-shards/branch /tmp/w2-final
          gh run download "$W2_RUN" -n r15-w2-internal-unlock-bundle -D /tmp/w2-unlock
          gh run download "$W2_RUN" -p 'r15-w2-history-*' -D /tmp/w2-shards/history
          gh run download "$W2_RUN" -p 'r15-w2-layout-*' -D /tmp/w2-shards/layout
          gh run download "$W2_RUN" -p 'r15-w2-branch-*' -D /tmp/w2-shards/branch
          python -m experiments.r15_wave2_dataset             --shards /tmp/w2-shards             --configs /tmp/w2-unlock/configs             --execution-manifest /tmp/w2-unlock/execution-manifest.json             --controller-commit "$W2_SHA"             --output /tmp/w2-final             --report /tmp/w2-final/audit-report.json

      - name: Recover Wave 3A from scientific shards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/w3a-unlock /tmp/w3a-shards /tmp/w3a-final
          gh run download "$W3A_RUN" -n r15-w3a-internal-unlock-bundle -D /tmp/w3a-unlock
          gh run download "$W3A_RUN" -p 'r15-w3a-*-shard-*' -D /tmp/w3a-shards
          python -m experiments.r15_wave3a_dataset             --shards /tmp/w3a-shards             --configs /tmp/w3a-unlock/configs             --execution-manifest /tmp/w3a-unlock/execution-manifest.json             --controller-commit "$W3A_SHA"             --output /tmp/w3a-final             --report /tmp/w3a-final/audit-report.json

      - name: Recover internal amendment dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/amend /tmp/amend-shards /tmp/amend-final
          gh run download "$AMEND_RUN" -n r15-internal-amendment-bundle -D /tmp/amend
          gh run download "$AMEND_RUN" -p 'r15-amendment-red04-*' -D /tmp/amend-shards/red04
          gh run download "$AMEND_RUN" -p 'r15-amendment-param02-*' -D /tmp/amend-shards/param02
          python -m experiments.r15_internal_amendment_dataset             --shards /tmp/amend-shards             --configs /tmp/amend/configs             --execution-manifest /tmp/amend/execution-manifest.json             --output /tmp/amend-final             --report /tmp/amend-final/audit-report.json

      - name: Recover STAT dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stat /tmp/stat-shards /tmp/stat-final
          gh run download "$STAT_RUN" -n r15-stat-tooling-bundle -D /tmp/stat
          gh run download "$STAT_RUN" -p 'r15-stat-data-*' -D /tmp/stat-shards
          python -m experiments.r15_stat_dataset             --shards /tmp/stat-shards             --configs /tmp/stat/configs             --execution-manifest /tmp/stat/execution-manifest.json             --output /tmp/stat-final             --report /tmp/stat-final/audit-report.json

      - name: Close mandatory R15 and build locked analysis surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r15-final
          python -m experiments.r15_final_closure             --dataset /tmp/w1             --dataset /tmp/w2-final             --dataset /tmp/w3a-final             --dataset /tmp/amend-final             --dataset /tmp/stat-final             --configs /tmp/w2-unlock/configs             --output /tmp/r15-final             --report /tmp/r15-final/r15-final-report.json

      - name: Attach optional exploratory engineering evidence
        if: env.ENG_RUN != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r15-final/exploratory-engineering
          gh run download "$ENG_RUN"             -n r15-exploratory-engineering-dataset             -D /tmp/r15-final/exploratory-engineering || true

      - uses: actions/upload-artifact@v4
        with:
          name: r15-final-mandatory-closure
          path: /tmp/r15-final/
          if-no-files-found: error
          retention-days: 90
