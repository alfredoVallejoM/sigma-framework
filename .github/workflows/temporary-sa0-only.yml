name: temporary-sa0-only
# remediation-pass: 2

on:
  push:
    branches:
      - campaign/sigma-dual-integrity-product-closure
    paths:
      - ".github/workflows/temporary-sa0-only.yml"

permissions:
  contents: read

jobs:
  sa0:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,quality]"
      - name: Quality
        run: |
          python -m compileall -q sigma/artifact reference/artifact_v1.py scripts/product_closure/sa0_gate.py scripts/product_closure/generate_sa0_vectors.py
          ruff check             sigma/artifact             sigma/tree/manifest.py             sigma/tree/delta.py             sigma/version.py             reference/artifact_v1.py             scripts/product_closure/sa0_gate.py             scripts/product_closure/generate_sa0_vectors.py             tests/unit/test_artifact_sa0.py             tests/differential/test_artifact_reference_sa0.py             tests/vectors/test_artifact_sa0_vectors.py
          mypy sigma/artifact reference/artifact_v1.py
      - name: Focused tests
        run: |
          pytest -q             tests/unit/test_artifact_sa0.py             tests/differential/test_artifact_reference_sa0.py             tests/vectors/test_artifact_sa0_vectors.py             tests/unit/test_tree_delta_st4.py
      - name: Frozen vectors
        run: python -m scripts.product_closure.generate_sa0_vectors --check
      - name: SA0 gate
        run: |
          mkdir -p reports
          python -m scripts.product_closure.sa0_gate --report reports/sa0-gate.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sa0-only-report
          path: reports/sa0-gate.json
          if-no-files-found: warn
