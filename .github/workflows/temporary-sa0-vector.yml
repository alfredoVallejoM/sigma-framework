name: temporary-sa0-vector
# remediation-pass: 2

on:
  push:
    branches:
      - campaign/sigma-dual-integrity-product-closure
    paths:
      - ".github/workflows/temporary-sa0-vector.yml"

permissions:
  contents: read

jobs:
  sa0-vector:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,quality]"
      - name: Compile
        run: |
          python -m compileall -q sigma/artifact reference/artifact_v1.py scripts/product_closure/generate_sa0_vectors.py
      - name: Ruff
        run: |
          ruff check             sigma/artifact             sigma/version.py             reference/artifact_v1.py             scripts/product_closure/generate_sa0_vectors.py             tests/unit/test_artifact_sa0.py             tests/differential/test_artifact_reference_sa0.py
      - name: Mypy
        run: |
          mypy sigma/artifact reference/artifact_v1.py
      - name: Pytest
        run: |
          pytest -q             tests/unit/test_artifact_sa0.py             tests/differential/test_artifact_reference_sa0.py
      - name: Generate canonical vector preview
        run: |
          python -m scripts.product_closure.generate_sa0_vectors --output /tmp/sigma-artifact-v1-sa0.json
