name: temporary-sv12-closure

on:
  push:
    branches:
      - campaign/sigma-dual-integrity-product-closure
    paths:
      - ".github/workflows/temporary-sv12-closure.yml"

permissions:
  contents: read

jobs:
  sv12-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,quality]"
      - name: Focused quality
        run: |
          python -m compileall -q sigma/trajectory scripts/product_closure/sv1_gate.py scripts/product_closure/sv2_gate.py
          ruff check sigma/trajectory/checkpoint_v3.py sigma/trajectory/policy_v1.py scripts/product_closure/sv1_gate.py scripts/product_closure/sv2_gate.py
          mypy sigma/trajectory/checkpoint_v3.py sigma/trajectory/policy_v1.py reference/trajectory_checkpoint_v3.py
      - name: Focused tests
        run: |
          pytest -q             tests/unit/test_trajectory_checkpoint_sv1.py             tests/differential/test_trajectory_checkpoint_reference_sv1.py             tests/unit/test_verification_policy_sv2.py             tests/property/test_verification_policy_properties_sv2.py             tests/vectors/test_verification_policy_sv2_vectors.py
      - name: SV1 gate
        run: |
          mkdir -p reports
          python -m scripts.product_closure.sv1_gate --report reports/sv1-gate.json
      - name: SV2 gate
        run: |
          python -m scripts.product_closure.sv2_gate --report reports/sv2-gate.json
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sv12-closure-reports
          path: reports/*.json
          if-no-files-found: warn
