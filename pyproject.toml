[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-framework"
version = "2.2.0a2"
authors = [{ name = "Alfredo Vallejo Martín" }]
description = "Experimental framework for canonical wide-input hash combiners"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "hypothesis>=6.100",
    "coverage[toml]>=7.6",
    "argon2-cffi>=23.1",
    "cryptography>=44",
]
quality = ["mypy>=1.10", "ruff>=0.9", "build>=1.2"]
analysis = ["matplotlib>=3.8", "numpy>=1.26", "scipy>=1.12"]
kdf = ["argon2-cffi>=23.1"]
fuzz = ["atheris"]
mutation = ["mutmut>=3"]
signatures = ["cryptography>=44"]

[project.scripts]
sigmahash = "sigma.cli_v2:main"
sigmahash-v2 = "sigma.cli_v2:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
pythonpath = ["."]

[tool.coverage.run]
parallel = true
patch = ["subprocess"]
source = ["sigma", "scripts", "experiments", "reference"]

[tool.coverage.report]
precision = 2
show_missing = true

[tool.setuptools.packages.find]
include = ["sigma*", "experiments*", "reference*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "RUF"]
ignore = ["E501", "RUF002", "RUF003", "SIM115"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "argon2", "argon2.*", "atheris"]
ignore_missing_imports = true

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true

[tool.mutmut]
source_paths = ["sigma/"]
pytest_add_cli_args_test_selection = ["tests/unit/", "tests/property/"]
also_copy = ["experiments/", "scripts/", "specification/"]
